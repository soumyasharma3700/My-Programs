<!DOCTYPE html>
<html lang = "en">
<head>
<title>Responsive Product Grid</title>
<style>
*{
margin : 0;
padding : 0;
box - sizing : border-box;
}
body{
font - family : "sans- serif";
background : linear gradient (to bottom, yellow,orange);
padding : 20px;
min height :100vh;
}
header{
text-align : center;
margin - bottom : 40px;
padding :30px;
}
h1 {
    font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
           
        }        

        

        
           .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 0;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .card-image {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
            border-bottom: 3px solid #f0f0f0;
         }

       
        .card-content {
            padding: 20px;
        }

        .card h3 {
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            color: #2c3e50;
        }

       

        .rating {
            color: #f39c12;
            margin: 10px 0;
            font-size: 0.9rem;
        }

        .price {
            font-weight: bold;
            color: #27ae60;
            font-size: 1.4rem;
            margin: 12px 0;
        }

        

        

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 12px;
            width: 100%;
            transition: background 0.3s ease;
        }

        .btn:hover {
            background: #2980b9;
        }

       
        
        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .card-image {
                height: 180px;
            }
        }

        
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .card-image {
                height: 220px;
            }

            .card h3 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>🛍️ E-Store</h1>
        
    </header>

    <div class="grid">
        
        <div class="card">
            <div class="card-image bg-purple">📱</div>
            <div class="card-content">
                <h3>Smartphone </h3>
                <div class="rating">⭐⭐⭐⭐⭐ (4.8)</div>
               
                <div>
                    <span class="price">25k</span></div>
                
                <button class="btn">Add to Cart</button>
            </div>
        </div>

    
        <div class="card">
            <div class="card-image bg-pink">⌚</div>
            <div class="card-content">
                <h3>Smart Watch</h3>
                <div class="rating">⭐⭐⭐⭐⭐ (4.7)</div>
              
                <div>
                    <span class="price">10k</span>
                    
                </div>
                
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        
        <div class="card">
            <div class="card-image bg-blue">📺</div>
            <div class="card-content">
                <h3>TV</h3>
                <div class="rating">⭐⭐⭐⭐☆ (4.5)</div>
                
                <div>
                    <span class="price">35k</span>
                    
                </div>
                
                <button class="btn">Add to Cart</button>
            </div>
        </div>

        
        

       
   
</body>
</html>
